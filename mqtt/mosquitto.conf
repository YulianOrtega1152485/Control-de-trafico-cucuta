# Configuracion local del broker Mosquitto para el proyecto (B10).
# Portable: sin rutas absolutas ni contrasenas (demo con acceso anonimo).
#
# Arrancar el broker con:
#   mosquitto -c mqtt/mosquitto.conf
#
# El nodo de borde (src/nodo_mqtt.py) y el centro de control
# (src/control_remoto.py) se conectan a 127.0.0.1:1883.

listener 1883 127.0.0.1
allow_anonymous true
